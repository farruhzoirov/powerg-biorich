<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerG Biorich — Tabiiy Mahsulotlar</title>
  <meta name="description" content="PowerG Biorich — Malayziyadan olib kelingan sifatli tabiiy mahsulotlar. Sog'liq va farovonlik uchun eng yaxshi tanlov." />
  <meta property="og:title" content="PowerG Biorich" />
  <meta property="og:description" content="Malayziyadan tabiiy mahsulotlar" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ═══ HEADER ═══════════════════════════════════════════════ -->
  <header id="main-header">
    <div class="container">
      <nav class="nav-inner">
        <a href="#home" class="nav-logo">
          <div class="nav-logo-icon">🌿</div>
          PowerG Biorich
        </a>

        <div class="nav-links-desktop" id="nav-links"></div>

        <div style="display:flex;align-items:center;gap:1rem;">
          <div class="lang-switcher">
            <button class="lang-btn" data-lang="uz">UZ</button>
            <button class="lang-btn" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>
          <button class="hamburger" id="menu-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="#home"     onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('menu-toggle').classList.remove('open')">Bosh sahifa</a>
    <a href="#products" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('menu-toggle').classList.remove('open')">Mahsulotlar</a>
    <a href="#about"    onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('menu-toggle').classList.remove('open')">Biz haqimizda</a>
    <a href="#contact"  onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('menu-toggle').classList.remove('open')">Aloqa</a>
    <div class="mobile-lang-switcher">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <!-- ═══ HERO ══════════════════════════════════════════════════ -->
  <section id="home">
    <div class="hero-bg"></div>
    <!--
      Hero image — replace with your own photo.
      Recommended size: 1920 × 900 px (landscape, JPG/WebP)
      The image will fill the full viewport height (100vh, max 900px).
    -->
    <img
      src="images/hero.jpg"
      alt="PowerG Biorich hero"
      class="hero-image"
      onerror="this.style.display='none'"
    />
    <div class="hero-overlay"></div>

    <div class="container hero-content">
      <span class="hero-badge" id="hero-badge"></span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <div class="hero-actions">
        <a href="#products" class="btn-primary" id="hero-cta"></a>
        <a href="#about"    class="btn-outline" id="hero-cta-secondary"></a>
      </div>
    </div>

    <div class="hero-scroll-indicator">
      <div class="arrow"></div>
    </div>
  </section>

  <!-- ═══ PRODUCTS ══════════════════════════════════════════════ -->
  <section id="products">
    <div class="container">
      <div class="section-header animate-on-scroll">
        <span class="section-badge" id="products-badge"></span>
        <h2 class="section-title" id="products-title"></h2>
        <p class="section-subtitle" id="products-subtitle"></p>
      </div>
      <div class="products-grid" id="products-grid"></div>
    </div>
  </section>

  <!-- ═══ ABOUT ════════════════════════════════════════════════ -->
  <section id="about">
    <div class="container">

      <div class="about-grid animate-on-scroll">
        <div class="about-text">
          <span class="section-badge" id="about-badge"></span>
          <h2 class="about-title" id="about-title"></h2>
          <p class="about-story" id="about-story"></p>
          <div class="mission-vision">
            <div class="mv-card">
              <h4 id="mission-title"></h4>
              <p  id="mission-text"></p>
            </div>
            <div class="mv-card">
              <h4 id="vision-title"></h4>
              <p  id="vision-text"></p>
            </div>
          </div>
        </div>

        <div class="about-stats-wrap">
          <div class="stats-grid" id="about-stats"></div>
        </div>
      </div>

      <div class="features-grid" id="about-features"></div>

    </div>
  </section>

  <!-- ═══ CONTACT ═══════════════════════════════════════════════ -->
  <section id="contact">
    <div class="container">
      <div class="contact-grid">

        <!-- Info side -->
        <div class="contact-info animate-on-scroll">
          <span class="section-badge" id="contact-badge"></span>
          <h2 class="contact-title" id="contact-title"></h2>
          <p class="contact-subtitle" id="contact-subtitle"></p>

          <div class="info-list">
            <div class="info-item">
              <div class="info-icon-wrap">📞</div>
              <div>
                <div class="info-label" id="info-phone-label"></div>
                <!-- Replace with your real phone number -->
                <div class="info-value">+998 XX XXX XX XX</div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon-wrap">✉️</div>
              <div>
                <div class="info-label" id="info-email-label"></div>
                <!-- Replace with your real email -->
                <div class="info-value">info@powerg-biorich.uz</div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon-wrap">📍</div>
              <div>
                <div class="info-label" id="info-location-label"></div>
                <div class="info-value" id="info-location-value"></div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon-wrap">🕐</div>
              <div>
                <div class="info-label" id="info-hours-label"></div>
                <div class="info-value" id="info-hours-value"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Form side -->
        <div class="contact-form-wrap animate-on-scroll">
          <form id="contact-form" novalidate>
            <div class="form-group">
              <label class="form-label" id="label-name" for="input-name"></label>
              <input class="form-input" id="input-name" type="text" required />
            </div>
            <div class="form-group">
              <label class="form-label" id="label-phone" for="input-phone"></label>
              <input class="form-input" id="input-phone" type="tel" />
            </div>
            <div class="form-group">
              <label class="form-label" id="label-message" for="input-message"></label>
              <textarea class="form-textarea" id="input-message" required></textarea>
            </div>
            <button class="form-submit-btn" id="submit-btn" type="submit"></button>
            <div class="form-success" id="form-success"></div>
          </form>
        </div>

      </div>
    </div>
  </section>

  <!-- ═══ FOOTER ════════════════════════════════════════════════ -->
  <footer>
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <div class="nav-logo" style="margin-bottom:1rem;">
            <div class="nav-logo-icon">🌿</div>
            PowerG Biorich
          </div>
          <p class="footer-tagline" id="footer-tagline"></p>
        </div>
        <div>
          <h4 class="footer-links-title" id="footer-quick-links-title"></h4>
          <ul class="footer-links" id="footer-nav-links"></ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p id="footer-rights"></p>
      </div>
    </div>
  </footer>

  <script src="js/translations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
